name: Build and publish site

# Builds the static site and publishes ONLY the built files to the `deploy` branch.
# Hostinger hPanel > Advanced > Git pulls that branch into the domain's folder
# (auto-deploy via a GitHub webhook). The repo's source never reaches the web server.

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '15 20 * * 0'   # weekly rebuild so expired listings and sponsored slots drop off and rotate

permissions:
  contents: write

env:
  FTP_HOST: ${{ secrets.FTP_HOST }}
  FTP_DIR: ${{ secrets.FTP_DIR }}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npx next build

      - name: Stamp build with commit SHA
        run: echo "${{ github.sha }}" > out/version.txt

      - name: Keep a downloadable copy of the built site (emergency manual upload)
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: out/
          retention-days: 14
          include-hidden-files: true

      - name: Publish built site to the deploy branch
        env:
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          cd out
          git init -q -b deploy
          git config user.name "veda-deploy-bot"
          git config user.email "deploy-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Build of ${SHA}"
          git push --force "https://x-access-token:${TOKEN}@github.com/${REPO}.git" deploy
          echo "Published build ${SHA} to branch 'deploy'."

      - name: Upload to Hostinger over FTPS, keeping your private files (only when the FTP secrets are set)
        # Why: the hPanel Git pull replaces the web folder, so a settings file placed there disappears on every deploy.
        # This step syncs the built site and never deletes the protected paths below (settings, private data, server folders).
        # Needs repository secrets FTP_HOST, FTP_USER, FTP_PASSWORD and FTP_DIR (the site's web folder, e.g. /public_html).
        # Set the variable FTP_DRY_RUN to true for a first run that only lists what would change.
        if: env.FTP_HOST != '' && env.FTP_DIR != ''
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          DRY: ${{ vars.FTP_DRY_RUN == 'true' && '--dry-run' || '' }}
        run: |
          test -f out/index.html || { echo "out/index.html missing; refusing to sync"; exit 1; }
          sudo apt-get install -y lftp >/dev/null
          lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set net:max-retries 3
          set net:timeout 30
          mirror -R --delete --parallel=4 --only-newer $DRY \
            -x '^api/private/' -x '^vh-config\.php$' -x '^vh-data/' -x '^\.well-known/' -x '^cgi-bin/' -x '^\.htpasswds/' -x '^error_log$' -x '^\.ftpquota$' \
            out "$FTP_DIR"
          bye
          EOF
          echo "Synced out/ to $FTP_DIR (private files kept)."

      - name: Check that the live site shows this build
        id: verify
        # hPanel Git pulls the deploy branch when GitHub tells it to (webhook). Allow ~4 minutes.
        # A failure here is a WARNING, not a failed deploy: the build itself is fine.
        continue-on-error: true
        env:
          VERIFY_ATTEMPTS: '12'
        run: scripts/verify-deploy.sh "${{ vars.SITE_URL || 'https://www.vedaheritage.co.in' }}" "${{ github.sha }}"

      - name: Say so clearly if Hostinger has not picked it up yet
        if: steps.verify.outcome == 'failure'
        run: |
          echo "::warning title=Live site not updated yet::The new build is ready on the deploy branch, but Hostinger has not pulled it. In hPanel > Advanced > Git click Deploy, and check the GitHub webhook (see docs/DEPLOYMENT.md)."
