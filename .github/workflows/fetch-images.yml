name: Fetch licensed images

# Runs in PARALLEL with the content fill (own concurrency group). Finds free-to-use photos for entries with fewer than
# 2 images: Wikimedia Commons, then Openverse, then Pexels / Pixabay / Unsplash when their API keys are set. Weekly, or on demand. Then, per the admin switch (Run agents > How does agent work reach the site?):
#   publish automatically: entries that now pass every gate go live and the site deploys;
#   review first: opens ONE pull request and a human checks each photo before merging.

on:
  schedule:
    - cron: '40 3 * * 1'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max entries per run (blank = 60)'
        required: false
      slug:
        description: 'Only this entry slug (optional)'
        required: false
      force:
        description: 'Replace existing images'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: fetch-images
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Stop switch (admin pause / kill)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/agent-guard.mjs fetch-images
      - name: Fetch images (Commons, Openverse, Pexels, Pixabay, Unsplash)
        env:
          OPENVERSE_CLIENT_ID: ${{ secrets.OPENVERSE_CLIENT_ID }}
          OPENVERSE_CLIENT_SECRET: ${{ secrets.OPENVERSE_CLIENT_SECRET }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          LIMIT: ${{ inputs.limit }}
          SLUG: ${{ inputs.slug }}
          FORCE: ${{ inputs.force }}
        run: |
          args=()
          [ -n "$SLUG" ] && args+=(--only "$SLUG")
          [ "$FORCE" = "true" ] && args+=(--force)
          args+=(--limit "${LIMIT:-60}")
          node scripts/fetch-commons-images.mjs "${args[@]}"
      - name: Validate, build, publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_BRANCH: ${{ vars.CONTENT_BASE_BRANCH || 'main' }}
          SHIP_JOB: fetch-images
        run: bash scripts/ship.sh 'Add free-to-use photos' src/content public/images/discover agents/reports
