name: Deploy to Hostinger (FTP fallback, manual)

# FALLBACK ONLY. The normal path is deploy.yml (publishes the built site to the `deploy` branch,
# which hPanel's Git pulls). Do not run both against the same folder.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npx next build

      - name: Stamp build with commit SHA
        run: echo "${{ github.sha }}" > out/version.txt

      - name: Keep a downloadable copy of the built site (emergency manual upload)
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: out/
          retention-days: 14
          include-hidden-files: true

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./out/
          # Where the files go on the FTP server. Override WITHOUT a code change by setting the repo
          # variable FTP_SERVER_DIR (Settings → Secrets and variables → Actions → Variables),
          # e.g. /public_html/ if this domain is the plan's primary domain. See docs/DEPLOYMENT.md.
          server-dir: ${{ vars.FTP_SERVER_DIR || '/domains/vedaheritage.co.in/public_html/' }}
          exclude: |
            **/.git*
            **/.git*/**

      - name: Verify the live site is serving this build
        run: scripts/verify-deploy.sh "${{ vars.SITE_URL || 'https://www.vedaheritage.co.in' }}" "${{ github.sha }}"
