name: Publish approved story

# A story submission arrives as an issue labelled "story-submission".
# When the editor adds the "approved" label, this opens a PR that adds the
# story as JSON. Merging the PR publishes it (the second, final gate).

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  story-to-pr:
    if: github.event.label.name == 'approved' && contains(github.event.issue.labels.*.name, 'story-submission')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch quarantined uploads (if any)
        run: git fetch origin community-uploads || true
      - uses: actions/github-script@v7
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          BASE_BRANCH: ${{ vars.CONTENT_BASE_BRANCH || 'main' }}
        with:
          script: |
            const fs = require('fs')
            const m = process.env.ISSUE_BODY.match(/```json\n([\s\S]*?)\n```/)
            if (!m) core.setFailed('No JSON block found in issue body')
            const s = JSON.parse(m[1])                      // data only, never executed
            const types = ['Experience', 'Folklore I heard', 'Travel tip']
            const clip = (v, n) => String(v || '').replace(/<[^>]*>/g, '').trim().slice(0, n)
            const date = new Date().toISOString().slice(0, 10)
            const id = `${date}-issue-${process.env.ISSUE_NUMBER}`
            const story = {
              id,
              type: types.includes(s.type) ? s.type : 'Experience',
              title: clip(s.title, 120),
              body: clip(s.body, 4000),
              author: clip(s.author, 60),
              ...(s.origin ? { origin: clip(s.origin, 60) } : {}),
              ...(s.entryCategory && /^[a-z0-9-]+$/.test(s.entrySlug || '') ? { entryCategory: s.entryCategory, entrySlug: s.entrySlug } : {}),
              date,
              status: 'approved',
            }
            // Photos: copy from the quarantine branch after strict path checks.
            const { execFileSync } = require('child_process')
            const photos = []
            for (const [i, ph] of (Array.isArray(s.photos) ? s.photos : []).slice(0, 2).entries()) {
              if (!/^pending-uploads\/\d{8}-[0-9a-f]{8}\/[12]\.jpg$/.test(ph.path || '')) continue
              const buf = execFileSync('git', ['show', `origin/community-uploads:${ph.path}`], { maxBuffer: 10 * 1024 * 1024 })
              if (buf.length < 1000 || buf[0] !== 0xff || buf[1] !== 0xd8) continue   // must be a JPEG
              fs.mkdirSync('public/images/community', { recursive: true })
              const dest = `/images/community/${id}-${i + 1}.jpg`
              fs.writeFileSync(`public${dest}`, buf)
              photos.push({ src: dest, alt: clip(ph.alt, 160) || `Photo by ${clip(s.author, 60)}`, credit: clip(s.author, 60) })
            }
            if (photos.length) story.photos = photos
            fs.mkdirSync('src/content/stories', { recursive: true })
            fs.writeFileSync(`src/content/stories/${id}.json`, JSON.stringify(story, null, 2) + '\n')
            core.exportVariable('STORY_ID', id)
      - name: Validate
        run: node scripts/validate-content.mjs
      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_BRANCH: ${{ vars.CONTENT_BASE_BRANCH || 'main' }}
        run: |
          git config user.name "veda-content-bot"
          git config user.email "content-bot@users.noreply.github.com"
          git checkout -b "story/${STORY_ID}"
          git add src/content/stories public/images/community
          git commit -m "content: publish traveller story ${STORY_ID}"
          git push origin "story/${STORY_ID}"
          gh pr create --base "$BASE_BRANCH" --head "story/${STORY_ID}" \
            --title "Publish traveller story ${STORY_ID}" \
            --body "Approved from issue #${{ github.event.issue.number }}. Merge to publish."
