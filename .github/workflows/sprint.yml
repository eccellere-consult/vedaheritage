name: Fill content (simple, autonomous)

# The simple content route. One grounded web-search call per page, no verifier chain, no strict schema.
# Runs every day on its own: finds what Kerala readers want now, writes new pages (live when publishing is automatic),
# then refreshes the stalest pages with dated "what's new" items. The admin stop switch is checked first.
# Manual run: Actions > Fill content, or "Start sprint" in the admin.

on:
  schedule:
    - cron: '20 2 * * *'   # checks daily; scripts/fill-plan.mjs runs it only every N days (admin setting, default 7)
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Total time budget in minutes'
        default: ''
      max:
        description: 'Max new pages (blank = admin setting)'
        default: ''
      budget:
        description: 'Spend cap in USD (blank = admin setting)'
        default: ''
      provider:
        description: 'AI provider (saved = use the default saved in the admin page)'
        type: choice
        options: [saved, auto, xai, openai, anthropic]
        default: saved

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: content-sprint
  cancel-in-progress: false

jobs:
  sprint:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ vars.CONTENT_BASE_BRANCH || 'main' }}   # newest main, not the commit that was current when the run was queued
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Is a run due?
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          IN_MINUTES: ${{ inputs.minutes }}
          IN_MAX: ${{ inputs.max }}
          IN_BUDGET: ${{ inputs.budget }}
        run: node scripts/fill-plan.mjs
      - name: Stop switch (admin pause / kill)
        if: steps.plan.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/agent-guard.mjs sprint
      - name: Fill new pages, refresh stale ones, ship
        if: steps.plan.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_BRANCH: ${{ vars.CONTENT_BASE_BRANCH || 'main' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          AGENT_PROVIDER: ${{ (inputs.provider != '' && inputs.provider != 'saved') && inputs.provider || vars.AGENT_PROVIDER }}
          AGENT_MODEL: ${{ vars.AGENT_MODEL }}
          ENRICHER_PROVIDER: ${{ vars.ENRICHER_PROVIDER }}
          ENRICHER_MODEL: ${{ vars.ENRICHER_MODEL }}
          OPENAI_PRICE_IN_PER_M: ${{ vars.OPENAI_PRICE_IN_PER_M }}
          OPENAI_PRICE_OUT_PER_M: ${{ vars.OPENAI_PRICE_OUT_PER_M }}
          XAI_PRICE_IN_PER_M: ${{ vars.XAI_PRICE_IN_PER_M }}
          XAI_PRICE_OUT_PER_M: ${{ vars.XAI_PRICE_OUT_PER_M }}
          FILL_CONCURRENCY: ${{ vars.FILL_CONCURRENCY || '6' }}
          MINUTES: ${{ steps.plan.outputs.minutes }}
          MAX: ${{ steps.plan.outputs.max }}
          BUDGET: ${{ steps.plan.outputs.budget }}
        run: |
          FILL_B=$(awk -v b="$BUDGET" 'BEGIN{print b*0.8}'); REF_B=$(awk -v b="$BUDGET" 'BEGIN{print b*0.2}')
          node agents/run.mjs fill --minutes "$MINUTES" --max "$MAX" --budget "$FILL_B" || true
          cp agents/reports/latest.md /tmp/fill-report.md 2>/dev/null || true
          node agents/run.mjs refresh --max 40 --minutes 25 --budget "$REF_B" || true
          cat /tmp/fill-report.md agents/reports/latest.md > /tmp/both.md 2>/dev/null && cp /tmp/both.md agents/reports/latest.md || true
          bash scripts/ship.sh "content: fill $(date +%F)" src/content agents/registers agents/reports
