name: Content agents (Scout → Enricher → Verifier)

# Runs twice a week (01:00 IST Monday and Thursday), or on demand.
# Two modes, switched in the admin (Run agents > How does agent work reach the site?):
#   review first: opens ONE pull request of DRAFT entries; nothing is public until a human approves.
#   publish automatically: entries that pass every check go straight to main and the site deploys;
#   the owner reviews on the site (edit, mark reviewed, unpublish, delete). Health topics and anything flagged stay drafts.

on:
  schedule:
    - cron: '30 19 * * 0,3'
  workflow_dispatch:
    inputs:
      command:
        description: 'What to run'
        type: choice
        options: [pipeline, scout, enrich, verify]
        default: pipeline
      max:
        description: 'Max new candidates (scout) / entries to write (enrich)'
        default: '3'
      slugs:
        description: 'verify only: comma-separated slugs (blank = all drafts)'
        required: false
      budget:
        description: 'Hard spend cap in USD for this run'
        default: '10'
      provider:
        description: 'AI provider for scout and enricher (saved = use the default saved in the admin page)'
        type: choice
        options: [saved, auto, xai, openai, anthropic]
        default: saved
      verifier:
        description: 'AI provider for the verifier (saved = use the saved default; auto = a different vendor from the writer)'
        type: choice
        options: [saved, auto, xai, openai, anthropic]
        default: saved

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: content-agents
  cancel-in-progress: false

jobs:
  agents:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Offline self-test of the agent pipeline and provider adapters
        run: npm run agents:test
      - name: Run agents
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          # Provider order: this run's choice (inputs above) > repository variables > the default saved in
          # agents/settings.json (admin page) > auto-detect (cheapest provider with a key: xAI, OpenAI, Anthropic).
          AGENT_PROVIDER: ${{ (inputs.provider != '' && inputs.provider != 'saved') && inputs.provider || vars.AGENT_PROVIDER }}
          AGENT_MODEL: ${{ vars.AGENT_MODEL }}
          SCOUT_PROVIDER: ${{ vars.SCOUT_PROVIDER }}
          SCOUT_MODEL: ${{ vars.SCOUT_MODEL }}
          ENRICHER_PROVIDER: ${{ vars.ENRICHER_PROVIDER }}
          ENRICHER_MODEL: ${{ vars.ENRICHER_MODEL }}
          VERIFIER_PROVIDER: ${{ (inputs.verifier != '' && inputs.verifier != 'saved') && inputs.verifier || vars.VERIFIER_PROVIDER }}
          VERIFIER_MODEL: ${{ vars.VERIFIER_MODEL }}
          # Optional price overrides, USD per million tokens, for the spend cap.
          OPENAI_PRICE_IN_PER_M: ${{ vars.OPENAI_PRICE_IN_PER_M }}
          OPENAI_PRICE_OUT_PER_M: ${{ vars.OPENAI_PRICE_OUT_PER_M }}
          XAI_PRICE_IN_PER_M: ${{ vars.XAI_PRICE_IN_PER_M }}
          XAI_PRICE_OUT_PER_M: ${{ vars.XAI_PRICE_OUT_PER_M }}
          CMD: ${{ inputs.command || 'pipeline' }}
          MAX: ${{ inputs.max || '3' }}
          SLUGS: ${{ inputs.slugs }}
          BUDGET: ${{ inputs.budget || vars.AGENT_MAX_USD || '10' }}
        run: |
          args=("$CMD" --max "$MAX" --budget "$BUDGET")
          if [ "$CMD" = "verify" ]; then
            if [ -n "$SLUGS" ]; then args+=(--slug "$SLUGS"); else args+=(--drafts); fi
          fi
          node agents/run.mjs "${args[@]}"
      - name: Find licensed images for the new drafts
        # Open-licence photos from Wikimedia Commons, credited. A human checks each one in the pull request.
        continue-on-error: true
        run: node scripts/fetch-commons-images.mjs --drafts
      - name: Publish entries that pass every check (only when automatic publishing is on)
        run: node scripts/auto-publish.mjs
      - name: Validate content
        run: node scripts/validate-content.mjs
      - name: Publish to the site, or open a pull request
        # autoPublish true (admin > Run agents): run ALL the pull-request checks, then commit to main and trigger the deploy;
        # the owner reviews on the site.
        # autoPublish false, or anything fails (build, push): open ONE pull request for review, as before.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_BRANCH: ${{ vars.CONTENT_BASE_BRANCH || 'main' }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo "No changes."; exit 0; fi
          git config user.name "veda-content-bot"
          git config user.email "content-bot@users.noreply.github.com"
          # The same checks the pull-request check runs: content, agent tests, admin tests, types, build.
          checks() { { node scripts/validate-content.mjs && npm run agents:test && npm run admin:test && npx tsc --noEmit && npx next build; } >/tmp/checks.log 2>&1; }
          auto=$(node -e "try{console.log(JSON.parse(require('fs').readFileSync('agents/settings.json','utf8')).autoPublish===true?'yes':'no')}catch(e){console.log('no')}")
          for p in src/content public/images/discover agents/queue agents/evidence agents/reports; do [ -e "$p" ] && git add -A "$p"; done
          git commit -m "content: agent-drafted entries"
          if [ "$auto" = "yes" ] && [ "$BASE_BRANCH" = "main" ]; then
            if checks; then
              for i in 1 2 3; do
                if git push origin HEAD:main; then
                  gh workflow run deploy.yml --ref main && echo "Published; deploy started."
                  exit 0
                fi
                # main moved while we worked: bring it in, then run every check again on the combined result
                if ! git pull --rebase origin main; then git rebase --abort; echo "Conflict with main."; break; fi
                checks || { tail -40 /tmp/checks.log; break; }
              done
              echo "Could not publish directly; opening a pull request instead."
            else
              tail -40 /tmp/checks.log; echo "A check failed; opening a pull request instead."
            fi
          fi
          branch="agents/$(date +%Y%m%d-%H%M)"
          git checkout -b "$branch"
          git push origin "$branch"
          { cat agents/reports/latest.md; printf '\n\n### Photos\nOpen-licence photos from Wikimedia Commons were added automatically where found. Check that each one shows the right place before approving. Entries with no photo cannot be published.\n'; } > /tmp/pr-body.md
          gh pr create --base "$BASE_BRANCH" --head "$branch" \
            --title "Agent-drafted entries for review ($(date +%F))" \
            --body-file /tmp/pr-body.md
